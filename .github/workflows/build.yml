name: Build JARVIS Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build JARVIS Unsigned App
      run: |
        xcodebuild -project JARVISApp.xcodeproj \
                   -scheme JARVISApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/JARVISApp.app Payload/
        zip -r "JARVIS.ipa" Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-ipa
        path: JARVIS.ipa
        retention-days: 30

    - name: Update v1.0.0 Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: JARVIS iOS (CallKit + Cloud Run Intercom)
        body: "Unsigned CallKit + WebRTC/WebSocket Intercom shell for JARVIS on Google Cloud Run & Home LAN Bridge. Includes OAuth Safari handoff, WhatsApp contact voice control, Proton/Gmail/Microsoft mail, 5 Gree+ ACs, 41 Tuya devices & Smart TV ADB."
        files: JARVIS.ipa
        make_latest: false

    - name: Publish v1.1.0 Latest Release IPA
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: JARVIS iOS v1.1.0 (Full Feature Suite + CallKit)
        body: "Unsigned CallKit + WebRTC/WebSocket Intercom shell for JARVIS v1.1.0. Pre-configured with Cloud Run bearer token, Safari OAuth handoff for Google/Microsoft/Claude/ChatGPT, CallKit answer/hangup bridge, WhatsApp contact search, Proton Mail, Gree+, Tuya, Smart TV & Antigravity Orchestrator models."
        files: JARVIS.ipa
        make_latest: true
